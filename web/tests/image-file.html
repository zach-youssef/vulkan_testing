<!doctype html>
<!-- Loading graphs' image files (zgal.loadImageFile) in a browser, decoded by the runtime's
     stb_image (particles/zgal/stb_image.wasm), not the browser: texels.png's texels arrive exactly,
     not premultiplied, and texture.jpg's exactly as native stb_image decodes them (assets/
     texture.jpg.rgba, which make test-pages dumps with web/decode/tests/stb_dump.cpp), as
     web/tests/assets.test.ts checks under Node. Checked by make test-pages (web/tools/chromium.ts
     and firefox.ts); the page's state is in <html data-zgal>. Served from build/web/tests, beside
     particles/ (whose runtime it uses) and assets/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZGAL image file test</title>
</head>
<body>
<pre id="zgal-message"></pre>
<script type="module">
import * as zgal from '../particles/zgal/index.js';

const message = document.getElementById('zgal-message');
const log = (text) => { console.log(text); message.textContent += `${text}\n`; };
const expected = [255, 0, 0, 255, 0, 255, 0, 128, 10, 20, 30, 0, 200, 100, 50, 255,
  1, 2, 3, 4, 128, 128, 128, 255, 255, 255, 255, 255, 0, 0, 0, 255];

// An RGBA8 texture's texels, rows top to bottom
async function texels(context, texture) {
  const device = context.device;
  const row = Math.ceil(texture.width * 4 / 256) * 256;
  const buffer = device.createBuffer({ size: row * texture.height, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const encoder = device.createCommandEncoder();
  encoder.copyTextureToBuffer({ texture }, { buffer, bytesPerRow: row }, [texture.width, texture.height]);
  device.queue.submit([encoder.finish()]);
  await buffer.mapAsync(GPUMapMode.READ);
  const bytes = new Uint8Array(buffer.getMappedRange());
  const result = new Uint8Array(texture.width * texture.height * 4);
  for (let y = 0; y < texture.height; y++) result.set(bytes.subarray(y * row, y * row + texture.width * 4), y * texture.width * 4);
  buffer.destroy();
  return result;
}

let context;
try {
  context = await zgal.Context.create({
    assets: async (path) => {
      const response = await fetch(new URL(`assets/${path}`, import.meta.url));
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      return new Uint8Array(await response.arrayBuffer());
    },
  });
  for (const [color, format] of [['srgb', 'rgba8unorm-srgb'], ['linear', 'rgba8unorm']]) {
    const graph = new zgal.RenderGraph(context);
    const image = await zgal.loadImageFile(context, graph, 'picture', 'texels.png', color);
    if (image.format !== format) throw new Error(`a ${color} image is ${image.format}, not ${format}`);
    const got = [...await texels(context, image.texture)];
    if (got.join() !== expected.join()) throw new Error(`${color} texels.png's texels are ${got.join(' ')}, not ${expected.join(' ')}`);
    graph.destroy();
  }
  const graph = new zgal.RenderGraph(context);
  const jpeg = await zgal.loadImageFile(context, graph, 'photo', 'texture.jpg', 'srgb');
  const response = await fetch(new URL('assets/texture.jpg.rgba', import.meta.url));
  if (!response.ok) throw new Error(`texture.jpg.rgba: ${response.status} ${response.statusText}`);
  const dump = new Uint8Array(await response.arrayBuffer());
  const header = new DataView(dump.buffer, 0, 8);
  const size = [header.getUint32(0, true), header.getUint32(4, true)];
  if (jpeg.size.join('x') !== size.join('x')) throw new Error(`texture.jpg loaded at ${jpeg.size.join('x')}, natively ${size.join('x')}`);
  const native = dump.subarray(8);
  const got = await texels(context, jpeg.texture);
  const at = got.findIndex((value, i) => value !== native[i]);
  if (got.length !== native.length || at !== -1) throw new Error(`texture.jpg's texels differ from native stb_image's (first at byte ${at})`);
  graph.destroy();
  let failed = false;
  try {
    await zgal.loadImageFile(context, new zgal.RenderGraph(context), 'picture', 'missing.png', 'srgb');
  } catch (error) {
    failed = /image-file picture \(missing\.png\)/.test(error.message);
  }
  if (!failed) throw new Error('a missing image file wasn\'t reported');
  await context.device.queue.onSubmittedWorkDone();
  if (context.errors.length > 0) throw new Error(`WebGPU errors:\n${context.errors.join('\n')}`);
  log('image files loaded as expected');
  document.documentElement.dataset.zgal = 'stopped';
} catch (error) {
  log(error instanceof Error ? error.message : String(error));
  document.documentElement.dataset.zgal = 'failed';
} finally {
  context?.destroy();
}
</script>
</body>
</html>
