# Sets up an ubuntu-24.04 runner to build and test the wrapper and ZGAL (or a project using them,
# such as ppu, with this repository as a submodule). The native toolchain has all of the below; the
# web one only what ZGAL's compiler and its web backend need (lavapipe, which Dawn runs on, Racket
# and Node), so a job that builds no C++ neither downloads the SDK nor saves a ccache:
#   - apt: lavapipe (Mesa's software Vulkan driver), and for native, GLFW, GLM, clang and ccache;
#   - native: the LunarG Vulkan SDK (headers, loader, glslc, validation layers), its tarball cached by
#     version, with VULKAN_SDK, PATH, LD_LIBRARY_PATH and VK_ADD_LAYER_PATH exported;
#   - native: clang++ through ccache as CXX, with the ccache directory cached per branch (falling back to
#     the default branch's) and keyed by the checked-out commit;
#   - Racket (full distribution, with Scribble) for ZGAL's compiler and docs;
#   - Node with npm's cache keyed by the web backend's lockfile.
name: setup-zgal
description: Installs the toolchain the wrapper, ZGAL and its web backend build and test with.
inputs:
  toolchain:
    description: "native (the C++ toolchain, the SDK and ccache too) or web (lavapipe, Racket and Node only)."
    required: true
  npm-lockfile:
    description: The web backend's package-lock.json, relative to the workspace (e.g. external/vulkan_test/web/package-lock.json in a project with this repository as a submodule).
    default: web/package-lock.json
  vulkan-sdk-version:
    description: The LunarG Vulkan SDK's version (the Mac's, so both validate with the same layers).
    default: 1.4.321.0
  racket-version:
    description: Racket's version.
    default: "8.18"
  node-version:
    description: Node's version.
    default: "24"
  default-branch:
    description: The branch whose ccache a new branch starts from.
    default: ${{ github.event.repository.default_branch }}
runs:
  using: composite
  steps:
    - name: Install lavapipe, and for native, GLFW, GLM, clang and ccache
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        case "$TOOLCHAIN" in
          native) native="libglfw3-dev libglm-dev clang ccache" ;;
          web) native= ;;
          *) echo "::error::setup-zgal: toolchain is native or web, not '$TOOLCHAIN'"; exit 1 ;;
        esac
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1 $native

    - name: Cache the Vulkan SDK
      if: inputs.toolchain == 'native'
      id: sdk-cache
      uses: actions/cache@v6
      with:
        path: ~/vulkansdk.tar.xz
        key: vulkan-sdk-linux-${{ inputs.vulkan-sdk-version }}

    # A slow download from LunarG once took 21 minutes, as curl had no timeout. An attempt at the
    # ~300 MB tarball is abandoned below 1 MB/s for 30 s or after 5 minutes, and is retried, as are
    # resets, partial transfers and 4xx (--retry-all-errors). No retry starts after 5 minutes, so the
    # download gives up after about 10
    - name: Download the Vulkan SDK
      if: inputs.toolchain == 'native' && steps.sdk-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SDK_VERSION: ${{ inputs.vulkan-sdk-version }}
      run: curl -sSfL --retry 3 --retry-all-errors --retry-max-time 300 --connect-timeout 30 --speed-limit 1000000 --speed-time 30 --max-time 300 -o ~/vulkansdk.tar.xz "https://sdk.lunarg.com/sdk/download/$SDK_VERSION/linux/vulkansdk-linux-x86_64-$SDK_VERSION.tar.xz"

    # setup-env.sh leaves VK_LAYER_PATH empty, and exporting that empty value would hide the layers
    # VK_ADD_LAYER_PATH adds, so it isn't exported
    - name: Unpack the Vulkan SDK
      if: inputs.toolchain == 'native'
      shell: bash
      env:
        SDK_VERSION: ${{ inputs.vulkan-sdk-version }}
      run: |
        mkdir -p ~/vulkansdk
        tar -xJf ~/vulkansdk.tar.xz -C ~/vulkansdk
        source ~/vulkansdk/$SDK_VERSION/setup-env.sh
        echo "VULKAN_SDK=$VULKAN_SDK" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
        echo "VK_ADD_LAYER_PATH=$VK_ADD_LAYER_PATH" >> "$GITHUB_ENV"
        echo "$VULKAN_SDK/bin" >> "$GITHUB_PATH"

    # ccache runs as clang++ (a symlink first on PATH), so CXX stays a single program, which ZGAL's
    # toolchain tests run directly
    - name: Use clang++ through ccache
      if: inputs.toolchain == 'native'
      id: ccache
      shell: bash
      env:
        DEFAULT: ${{ inputs.default-branch }}
      run: |
        # The branches' names for the cache keys: characters other than letters, digits, . _ - replaced
        echo "branch=${GITHUB_REF_NAME//[^A-Za-z0-9._-]/_}" >> "$GITHUB_OUTPUT"
        echo "default=${DEFAULT//[^A-Za-z0-9._-]/_}" >> "$GITHUB_OUTPUT"
        mkdir -p ~/.ccache-bin
        ln -sf "$(command -v ccache)" ~/.ccache-bin/clang++
        echo "$HOME/.ccache-bin" >> "$GITHUB_PATH"
        echo "CXX=clang++" >> "$GITHUB_ENV"
        echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
        echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Cache ccache
      if: inputs.toolchain == 'native'
      uses: actions/cache@v6
      with:
        path: ~/.ccache
        key: ccache-${{ steps.ccache.outputs.branch }}-${{ steps.ccache.outputs.commit }}
        restore-keys: |
          ccache-${{ steps.ccache.outputs.branch }}-
          ccache-${{ steps.ccache.outputs.default }}-

    - uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
      with:
        version: ${{ inputs.racket-version }}
        distribution: full
        variant: CS

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.npm-lockfile }}

    - name: Show the toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        if [ "$TOOLCHAIN" = native ]; then
          echo "VULKAN_SDK=$VULKAN_SDK"
          clang++ --version | head -1
          ccache --version | head -1
          glslc --version | head -1
          ccache -z > /dev/null
        fi
        racket --version
        node --version
