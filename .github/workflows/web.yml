# Runs the web backend's tests on each commit (make test-web): the runtime's tests and the web
# examples under Node on Dawn, which runs on lavapipe, then the test pages in headless Chromium on
# SwiftShader and in headless Firefox on lavapipe (through wgpu's Vulkan backend). Its token can't
# post statuses: ci.yml posts each commit's "web" status from its job's conclusion, found by the
# job's name, and passes only the commits that have this workflow, as older ones can't pass it.
name: web
on:
  workflow_call:
    inputs:
      commits:
        description: A JSON array of the commit SHAs to check.
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # The Playwright release whose Chromium headless shell runs the pages
  PLAYWRIGHT_VERSION: 1.63.0
  # The Firefox release whose tarball runs the pages, and the tarball's SHA-256 (from the release's
  # SHA256SUMS on archive.mozilla.org), so the browser under test only changes with this file
  FIREFOX_VERSION: 160.0.1
  FIREFOX_SHA256: 844d8a77aa4672a08ded949b6206f84d91bb82f6637c090fd58c3126e9d44119

jobs:
  web:
    name: web ${{ matrix.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sha: ${{ fromJSON(inputs.commits) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false

      # The actions come from the pushed workflow's commit, not the checked-out one, so every commit
      # is checked with the same setup
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github
          persist-credentials: false

      - uses: ./.ci/.github/actions/setup-zgal
        with:
          toolchain: web

      - name: Cache Playwright's browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.PLAYWRIGHT_VERSION }}-chromium-headless-shell-${{ runner.os }}

      # Ubuntu 24.04's AppArmor forbids the unprivileged user namespaces Chromium's sandbox needs.
      # CHROMIUM names the shell, so the pages fail rather than being skipped if it's missing.
      - name: Install Chromium's headless shell
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npx --yes "playwright@$PLAYWRIGHT_VERSION" install --with-deps chromium-headless-shell
          shells=(~/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell)
          if [ ${#shells[@]} -ne 1 ] || [ ! -x "${shells[0]}" ]; then
            echo "::error::Expected one Chromium headless shell, found: ${shells[*]}"
            exit 1
          fi
          echo "CHROMIUM=${shells[0]}" >> "$GITHUB_ENV"

      # Mozilla's release tarball, not the runner's Firefox, which is whatever the image has. FIREFOX
      # names it, so the pages fail rather than being skipped if it's missing. The libraries are
      # the ones its GTK build loads.
      - name: Install Firefox
        run: |
          sudo apt-get install -y -q --no-install-recommends libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libx11-xcb1 libxtst6
          mkdir -p "$RUNNER_TEMP/firefox"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/firefox.tar.xz" \
            "https://archive.mozilla.org/pub/firefox/releases/$FIREFOX_VERSION/linux-x86_64/en-US/firefox-$FIREFOX_VERSION.tar.xz"
          echo "$FIREFOX_SHA256  $RUNNER_TEMP/firefox.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/firefox.tar.xz" -C "$RUNNER_TEMP/firefox"
          echo "FIREFOX=$RUNNER_TEMP/firefox/firefox/firefox" >> "$GITHUB_ENV"
          echo "::notice::Firefox under test: $("$RUNNER_TEMP/firefox/firefox/firefox" --version)"

      # A step timeout, under the job's, so a hang still uploads the logs
      - name: Web tests
        timeout-minutes: 12
        run: make test-web BROWSERS="chromium firefox"

      # The tests print summaries; their full output is in build/logs
      - name: Upload the test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-${{ matrix.sha }}
          if-no-files-found: ignore
          path: build/logs
