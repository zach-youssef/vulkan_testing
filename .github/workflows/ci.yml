# On every push to a branch: lists the commits it brings (the commits action) and checks each one,
# each check posting a commit status on its own commit.
name: ci
on:
  push:
    branches: ["**"]

# A newer push to a working branch supersedes the running checks; the default branch's all finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions:
  contents: read
  statuses: write

jobs:
  commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commits: ${{ steps.commits.outputs.commits }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: commits
        uses: ./.github/actions/commits

  cpu:
    needs: commits
    uses: ./.github/workflows/cpu.yml
    with:
      commits: ${{ needs.commits.outputs.commits }}
