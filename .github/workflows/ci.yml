# On every push to a branch: lists the commits it brings (the commits action) and checks each one,
# each check posting a commit status on its own commit.
name: ci
on:
  push:
    branches: ["**"]

# A newer push to a working branch supersedes its running checks. Every run on the default branch
# finishes: each has its own group, since a group holds only one pending run and drops the others.
concurrency:
  group: ci-${{ github.ref }}${{ github.ref_name == github.event.repository.default_branch && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commits: ${{ steps.commits.outputs.commits }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: commits
        uses: ./.github/actions/commits

  cpu:
    needs: commits
    # Each commit's job posts its status
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/cpu.yml
    with:
      commits: ${{ needs.commits.outputs.commits }}

  web:
    needs: commits
    # Each commit's job posts its status
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/web.yml
    with:
      commits: ${{ needs.commits.outputs.commits }}
