# On every push to a branch: lists the commits it brings (the commits action) and checks each one,
# posting a commit status per check on each commit.
#
# Only the jobs that run no code from the repository's commits, npm or third-party actions can post
# statuses: the cpu and web jobs build and test with a read-only token, while the pending job marks
# the commits' checks pending first and the statuses job posts the outcome of each commit's job
# afterwards, from this run's jobs. Neither checks anything out.
name: ci
on:
  push:
    branches: ["**"]

# A newer push to a working branch supersedes its running checks. Every run on the default branch
# finishes: each has its own group, since a group holds only one pending run and drops the others.
concurrency:
  group: ci-${{ github.ref }}${{ github.ref_name == github.event.repository.default_branch && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commits: ${{ steps.commits.outputs.commits }}
      web: ${{ steps.web.outputs.commits }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: commits
        uses: ./.github/actions/commits
      # Commits from before web.yml existed can't pass it, so they get no web check
      - id: web
        env:
          COMMITS: ${{ steps.commits.outputs.commits }}
        run: |
          json=$(jq -r '.[]' <<< "$COMMITS" | while read -r sha; do
            if git cat-file -e "$sha:.github/workflows/web.yml" 2>/dev/null; then
              echo "$sha"
            else
              echo "$sha" >> "$RUNNER_TEMP/older"
            fi
          done | jq -R . | jq -cs .)
          if [ -e "$RUNNER_TEMP/older" ]; then
            while read -r sha; do
              echo "::notice::$(git rev-parse --short "$sha") predates the web check (no .github/workflows/web.yml): not checked, no web status"
            done < "$RUNNER_TEMP/older"
          fi
          echo "Commits to check on the web: $json"
          echo "commits=$json" >> "$GITHUB_OUTPUT"

  pending:
    needs: commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      CPU: ${{ needs.commits.outputs.commits }}
      WEB: ${{ needs.commits.outputs.web }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Each call is tried three times, and a failure doesn't stop the other commits' statuses
      - name: Mark the commits' checks pending
        run: |
          failed=0
          api() { for try in 1 2 3; do gh api "$@" && return; sleep 5; done; return 1; }
          post() {
            if [[ ! $1 =~ ^[0-9a-f]{40}$ ]]; then echo "::error::Not a commit SHA: '$1'"; failed=1; return; fi
            api "repos/$GITHUB_REPOSITORY/statuses/$1" -f state=pending -f context="$2" \
              -f target_url="$RUN_URL" -f description="$3" > /dev/null || failed=1
          }
          for sha in $(jq -r '.[]' <<< "$CPU"); do post "$sha" cpu "Building and testing"; done
          for sha in $(jq -r '.[]' <<< "$WEB"); do post "$sha" web "Testing the web backend"; done
          exit "$failed"

  cpu:
    needs: commits
    uses: ./.github/workflows/cpu.yml
    with:
      commits: ${{ needs.commits.outputs.commits }}

  web:
    needs: commits
    if: needs.commits.outputs.web != '[]'
    uses: ./.github/workflows/web.yml
    with:
      commits: ${{ needs.commits.outputs.web }}

  # Posts each commit's cpu and web statuses from the conclusion of its job ("<context> <sha>") in
  # this run: success and failure as they are, anything else (cancelled, timed out, skipped, never
  # run, or unreadable) as an error, so no commit stays pending. Each call is tried three times, and
  # a failure doesn't stop the other commits' statuses.
  statuses:
    needs: [commits, pending, cpu, web]
    if: always() && needs.commits.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CPU: ${{ needs.commits.outputs.commits }}
      WEB: ${{ needs.commits.outputs.web }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Post the commits' statuses
        run: |
          failed=0 listed=1
          api() { for try in 1 2 3; do gh api "$@" && return; sleep 5; done; return 1; }
          # The latest attempt of each of the run's jobs, named "<caller> / <context> <sha>"
          if jobs=$(api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | {name, conclusion, html_url}'); then
            jobs=$(jq -cs . <<< "$jobs")
          else
            echo "::error::Couldn't list the run's jobs"
            jobs='[]' listed=0 failed=1
          fi
          post() {
            local sha=$1 context=$2 done=$3 job conclusion url state description
            if [[ ! $sha =~ ^[0-9a-f]{40}$ ]]; then echo "::error::Not a commit SHA: '$sha'"; failed=1; return; fi
            job=$(jq -c --arg name "$context $sha" 'map(select(.name | endswith($name))) | last // {}' <<< "$jobs")
            conclusion=$(jq -r '.conclusion // "missing"' <<< "$job")
            [ "$listed" = 1 ] || conclusion=unreadable
            url=$(jq -r --arg run "$RUN_URL" '.html_url // $run' <<< "$job")
            case "$conclusion" in
              success) state=success description=$done ;;
              failure) state=failure description="Failed" ;;
              cancelled | timed_out) state=error description="Cancelled or timed out" ;;
              unreadable) state=error description="Couldn't read its job's outcome" ;;
              *) state=error description="Not run ($conclusion)" ;;
            esac
            echo "$context $sha: $conclusion -> $state"
            api "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state=$state -f context="$context" \
              -f target_url="$url" -f description="$description" > /dev/null || failed=1
          }
          for sha in $(jq -r '.[]' <<< "$CPU"); do post "$sha" cpu "Built and tested"; done
          for sha in $(jq -r '.[]' <<< "$WEB"); do post "$sha" web "Tested the web backend (Chromium; Firefox skipped)"; done
          exit "$failed"
