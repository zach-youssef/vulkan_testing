# Builds each commit (the examples and both test programs) and runs the tests that need no Vulkan
# device of their own: the CPU tests, and ZGAL's compiler tests with its docs (goldens, glslc, C++
# compile checks, WGSL checked by Dawn on lavapipe). Its token can't post statuses: ci.yml posts
# each commit's "cpu" status from its job's conclusion, found by the job's name.
name: cpu
on:
  workflow_call:
    inputs:
      commits:
        description: A JSON array of the commit SHAs to check.
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  cpu:
    name: cpu ${{ matrix.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sha: ${{ fromJSON(inputs.commits) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false

      # The actions come from the pushed workflow's commit, not the checked-out one, so every commit
      # is checked with the same setup
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github
          persist-credentials: false

      - uses: ./.ci/.github/actions/setup-zgal
        with:
          toolchain: native

      - name: Build
        run: make -j"$(nproc)" examples build/tests/cpu_tests build/tests/gpu_tests

      - name: CPU tests
        run: make test-cpu

      - name: ZGAL tests and docs
        run: make test-dsl

      - name: ccache statistics
        if: always()
        run: ccache -s
